version: '3.8'

services:
  funland:
    build: .
    container_name: funland
    restart: unless-stopped
    ports:
      - "${PORT_PORTAL:-8098}:${PORT_PORTAL:-8098}"
      - "${PORT_ADMIN:-8091}:${PORT_ADMIN:-8091}"
      - "${PORT_EMBY:-8097}:${PORT_EMBY:-8097}"
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - PORT_PORTAL=${PORT_PORTAL:-8098}
      - PORT_ADMIN=${PORT_ADMIN:-8091}
      - PORT_EMBY=${PORT_EMBY:-8097}
      - EMBY_UPSTREAM_URL=${EMBY_UPSTREAM_URL:-https://xart.fun:443}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-1800}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
